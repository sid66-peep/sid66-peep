<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="150" viewBox="0 0 840 150" role="img" aria-label="Data_Analysis_end_to_end_project repository"><title>Data_Analysis_end_to_end_project repository</title><style>@font-face{font-family:GeistC;font-weight:400;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:GeistC;font-weight:600;src:url(data:font/woff;base64,) format('woff')}
@font-face{font-family:GeistMonoC;font-weight:400;src:url(data:font/woff;base64,) format('woff')}
.a-up{animation:up .8s cubic-bezier(.22,1,.36,1) both}
.a-fade{animation:fade .9s ease-out both}
.a-pop{animation:pop .6s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:center}
.a-grow{animation:grow .9s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:50% 100%}
.a-sweep{animation:sweep 1.1s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box;transform-origin:0 50%}
.a-nudge{animation:nudge 2.4s ease-in-out 2 both;transform-box:fill-box}
.s{display:none}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
@keyframes sweep{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
@keyframes nudge{0%,60%,100%{transform:none}75%{transform:translate(3px,-3px)}}
