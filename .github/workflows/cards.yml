name: Profile cards

on:
  schedule:
    - cron: "17 2 * * *"   # daily, 02:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [render_cards.py, data/query.graphql, assets/**, fonts/**, .github/workflows/cards.yml]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh contribution data
        env:
          # GITHUB_TOKEN sees public contributions. To count private ones too, turn on
          # "Include private contributions on my profile" and/or add a CONTRIB_TOKEN secret
          # (a fine-grained PAT with read-only access).
          GH_TOKEN: ${{ secrets.CONTRIB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -F login="${{ github.repository_owner }}" -F query=@data/query.graphql > data/contributions.tmp
          python3 -c "import json,sys; d=json.load(open('data/contributions.tmp')); sys.exit('GraphQL error: %s' % d['errors'] if d.get('errors') else 0)"
          mv data/contributions.tmp data/contributions.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Render cards
        run: |
          pip install -r requirements.txt
          python render_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh profile cards"
            git push
          fi
